  '@nestjs/platform-express': 12.6.0
  '@nestjs/testing': 12.6.0
  '@swc/core': 1.16.22
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  tsc-alias: 1.9.10
  unplugin-swc: 2.0.0
