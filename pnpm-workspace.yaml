packages:
  - apps/*
  - libs/shared/*
  - libs/web/*
  - libs/web/features/*

# Exact versions shared across packages. Never use ^ or ~.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: false
  lmdb: false
  msgpackr-extract: false

