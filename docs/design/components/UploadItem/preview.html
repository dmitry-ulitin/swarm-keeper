<!-- @dsCard group="Upload" height=260 subtitle="Hash, upload, duplicate, error, done" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UploadItem — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>.fa-list { max-width: 560px; }</style>
</head>
<body>
<div class="fa-stage">
  <div class="fa-list" role="list" aria-label="Upload queue">
    <div class="fa-up" role="listitem">
      <span class="fa-up-thumb"><svg class="fa-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></span>
      <div class="fa-up-main">
        <div class="fa-up-name">IMG_4021.HEIC<span class="fa-caption">3.4 MB</span></div>
        <div class="fa-progress" aria-label="Checking file"><i style="width:35%"></i></div>
      </div>
      <span class="fa-status fa-status-neutral">Checking</span>
    </div>
    <div class="fa-up" role="listitem">
      <span class="fa-up-thumb"><svg class="fa-ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
      <div class="fa-up-main">
        <div class="fa-up-name">Irinas_wedding.mp4<span class="fa-caption">1.8 of 4.2 GB · 6 min left</span></div>
        <div class="fa-progress" aria-label="Uploaded 43%"><i style="width:43%"></i></div>
      </div>
      <button class="fa-btn fa-icon-btn" aria-label="Pause"><svg class="fa-ico" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    </div>
    <div class="fa-up" role="listitem">
      <span class="fa-up-thumb"><svg class="fa-ico" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
      <div class="fa-up-main">
        <div class="fa-up-name">IMG_3999.JPG<span class="fa-caption">already in the archive · July 12</span></div>
      </div>
      <span class="fa-status fa-status-warn">Duplicate</span>
    </div>
    <div class="fa-up" role="listitem">
      <span class="fa-up-thumb"><svg class="fa-ico" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg></span>
      <div class="fa-up-main">
        <div class="fa-up-name">Passport_scan.pdf<span class="fa-caption">no connection to the server</span></div>
      </div>
      <button class="fa-btn fa-btn-text">Retry</button>
    </div>
    <div class="fa-up" role="listitem">
      <span class="fa-up-thumb"><svg class="fa-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></span>
      <div class="fa-up-main">
        <div class="fa-up-name">IMG_4018.HEIC<span class="fa-caption">2.9 MB</span></div>
      </div>
      <span class="fa-status fa-status-ok"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Done</span>
    </div>
  </div>
</div>
</body>
</html>
