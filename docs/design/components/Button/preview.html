<!-- @dsCard group="Actions" height=200 subtitle="Compact and large modes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="fa-stage">
  <div class="fa-col">
    <span class="fa-caption">Compact (default)</span>
    <div class="fa-row">
      <button class="fa-btn fa-btn-primary"><svg class="fa-ico" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Upload</button>
      <button class="fa-btn fa-btn-tonal">Create album</button>
      <button class="fa-btn fa-btn-outline">Cancel</button>
      <button class="fa-btn fa-btn-text">Show all</button>
      <button class="fa-btn fa-btn-danger">Delete forever</button>
      <button class="fa-btn" disabled>Unavailable</button>
      <button class="fa-btn fa-icon-btn" aria-label="More"><svg class="fa-ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    </div>
  </div>
  <div class="fa-col" data-size="large">
    <span class="fa-caption">Large</span>
    <div class="fa-row">
      <button class="fa-btn fa-btn-primary"><svg class="fa-ico" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Upload</button>
      <button class="fa-btn fa-btn-tonal">Create album</button>
      <button class="fa-btn fa-btn-outline">Cancel</button>
      <button class="fa-btn fa-icon-btn" aria-label="More"><svg class="fa-ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
