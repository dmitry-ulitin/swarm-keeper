<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhotoTile — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>.fa-grid { overflow: hidden; }</style>
</head>
<body>
<div class="fa-stage">
  <div>
    <h3 class="fa-date">Saturday, July 12, 2025<span class="fa-caption">Pärnu · 38 photos</span></h3>
    <div class="fa-grid">
      <div class="fa-tile" style="width:180px" role="img" aria-label="Photo: beach">
        <svg class="fa-photo" viewBox="0 0 150 100" preserveAspectRatio="xMidYMid slice"><rect class="sky" width="150" height="100"/><circle class="sun" cx="112" cy="28" r="12"/><path class="hill" d="M0 72 Q40 52 80 68 T150 62 V100 H0z"/><path class="hill2" d="M0 86 Q50 76 150 84 V100 H0z"/></svg>
        <svg class="fa-fav" viewBox="0 0 24 24" aria-label="In favorites"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      </div>
      <div class="fa-tile" style="width:96px" role="img" aria-label="Photo: portrait" aria-selected="true">
        <svg class="fa-photo" viewBox="0 0 80 100" preserveAspectRatio="xMidYMid slice"><rect class="warm" width="80" height="100"/><circle class="deep" cx="40" cy="40" r="14"/><path class="hill" d="M14 100 Q14 64 40 64 Q66 64 66 100z"/></svg>
        <span class="fa-check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </div>
      <div class="fa-tile" style="width:160px" role="img" aria-label="Video: 1:24">
        <svg class="fa-photo" viewBox="0 0 150 100" preserveAspectRatio="xMidYMid slice"><rect class="sky" width="150" height="100"/><path class="hill2" d="M0 60 L40 34 L70 56 L100 28 L150 64 V100 H0z"/><path class="hill" d="M0 80 Q70 66 150 82 V100 H0z"/></svg>
        <span class="fa-media-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>1:24</span>
      </div>
      <div class="fa-tile fa-tile-processing" style="width:140px">
        <span>Processing…<br>preview coming soon</span>
      </div>
      <div class="fa-tile" style="width:190px" role="img" aria-label="Photo: family dinner" aria-selected="true">
        <svg class="fa-photo" viewBox="0 0 150 100" preserveAspectRatio="xMidYMid slice"><rect class="warm" width="150" height="100"/><rect class="deep" x="0" y="66" width="150" height="34"/><circle class="hill" cx="44" cy="46" r="12"/><circle class="hill2" cx="78" cy="42" r="12"/><circle class="sun" cx="112" cy="48" r="11"/></svg>
        <span class="fa-check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
