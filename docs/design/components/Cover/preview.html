<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swarm Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .ink { fill: var(--ink); }
  .brand { fill: var(--brand); }
  .tint { fill: var(--brand-container); }
  .ph { fill: var(--media-placeholder); }
  .warm { fill: var(--accent); }
  .tile { rx: var(--radius-md); }
  .dot { fill: var(--selection); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .95; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      ink 160×72 and 136×72, brand 200×72 (runs off the right edge) and 152×72, accent 112×72 once — full-tone tiles; brand-container and media-placeholder are light tiles between them; ≈40% of the cover
        arrangement three justified rows of equal-height tiles, like the photo timeline; the right edge is cut — the timeline continues
        pattern     tiles clipped by radius-md, rows of unequal width — from “Photos come first”: the cover itself looks like the archive timeline; one selection dot is the selected photo
        scales      row height 72 (tile-size × 0.6), gaps space-2 (8), padding space-4 (16), top space-8+space-2 (40), corners radius-md (8), dot r = space-3/1.2
      -->
      <rect class="ink tile"   x="16"  y="40"  width="160" height="72" rx="8"/>
      <rect class="ph tile"    x="184" y="40"  width="104" height="72" rx="8"/>
      <rect class="brand tile" x="296" y="40"  width="200" height="72" rx="8"/>
      <rect class="tint tile"  x="16"  y="120" width="96"  height="72" rx="8"/>
      <rect class="brand tile" x="120" y="120" width="152" height="72" rx="8"/>
      <rect class="warm tile"  x="280" y="120" width="112" height="72" rx="8"/>
      <rect class="ph tile"    x="400" y="120" width="120" height="72" rx="8"/>
      <rect class="ph tile"    x="16"  y="200" width="128" height="72" rx="8"/>
      <rect class="tint tile"  x="152" y="200" width="88"  height="72" rx="8"/>
      <rect class="ink tile"   x="248" y="200" width="136" height="72" rx="8"/>
      <rect class="tint tile"  x="392" y="200" width="140" height="72" rx="8"/>
      <circle class="dot" cx="36" cy="60" r="10"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Swarm Keeper</h1>
    <p class="tag">A family archive: the whole family's photos and documents in one place.</p>
  </div>
</div>
</body>
</html>
