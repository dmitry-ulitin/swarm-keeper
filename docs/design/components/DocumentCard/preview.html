<!-- @dsCard group="Documents" height=170 subtitle="Valid, expiring soon, expired" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DocumentCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="fa-stage">
  <div class="fa-row" style="align-items:stretch">
    <article class="fa-doc">
      <span class="fa-doc-icon">PDF</span>
      <div>
        <h4 class="fa-doc-title">Passport — Anna</h4>
        <p class="fa-doc-meta fa-caption">ID card · 2 pages</p>
        <span class="fa-status fa-status-ok">Valid until 03/2031</span>
      </div>
    </article>
    <article class="fa-doc">
      <span class="fa-doc-icon">JPG</span>
      <div>
        <h4 class="fa-doc-title">Health insurance</h4>
        <p class="fa-doc-meta fa-caption">Insurance · Dmitry, Anna</p>
        <span class="fa-status fa-status-warn">Expires in 24 days</span>
      </div>
    </article>
    <article class="fa-doc">
      <span class="fa-doc-icon">PDF</span>
      <div>
        <h4 class="fa-doc-title">Driver's license</h4>
        <p class="fa-doc-meta fa-caption">Property · Dmitry</p>
        <span class="fa-status fa-status-err">Expired Oct 12, 2026</span>
      </div>
    </article>
  </div>
</div>
</body>
</html>
