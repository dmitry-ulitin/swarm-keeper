<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="fa-stage">
  <div class="fa-row">
    <div class="fa-toast" role="status">
      <span>3 photos moved to trash</span>
      <button class="fa-btn fa-btn-text">Undo</button>
    </div>
  </div>
  <div class="fa-row">
    <div class="fa-toast fa-toast-error" role="alert">
      <svg class="fa-ico" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>
      <span>Couldn't save the album: no connection to the server</span>
      <button class="fa-btn fa-btn-text">Retry</button>
    </div>
  </div>
</div>
</body>
</html>
