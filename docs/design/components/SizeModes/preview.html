<!-- @dsCard group="Settings" height=330 subtitle="Compact by default, large by choice" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SizeModes — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="fa-stage">
  <div class="fa-row">
    <span class="fa-strong">Interface size</span>
    <div class="fa-seg" role="group" aria-label="Interface size">
      <button aria-pressed="true">Compact</button>
      <button aria-pressed="false">Large</button>
    </div>
    <span class="fa-caption">Saved in your profile; applies on the web and in the phone app</span>
  </div>
  <div class="fa-modes">
    <div class="fa-panel">
      <span class="fa-panel-head">Compact · 28px buttons · 13px text</span>
      <div class="fa-row">
        <button class="fa-btn fa-btn-primary">Invite</button>
        <button class="fa-btn fa-btn-outline">Cancel</button>
      </div>
      <div class="fa-member" style="padding-left:0;padding-right:0">
        <span class="fa-avatar">AP</span>
        <div class="fa-member-main"><div class="fa-strong">Anna Petrova</div><div class="fa-caption">anna@example.com</div></div>
        <span class="fa-role fa-role-admin">Admin</span>
      </div>
      <span class="fa-caption">Uploaded July 12 · 214 photos</span>
    </div>
    <div class="fa-panel" data-size="large">
      <span class="fa-panel-head">Large · 44px buttons · 17px text</span>
      <div class="fa-row">
        <button class="fa-btn fa-btn-primary">Invite</button>
        <button class="fa-btn fa-btn-outline">Cancel</button>
      </div>
      <div class="fa-member" style="padding-left:0;padding-right:0">
        <span class="fa-avatar">AP</span>
        <div class="fa-member-main"><div class="fa-strong">Anna Petrova</div><div class="fa-caption">anna@example.com</div></div>
        <span class="fa-role fa-role-admin">Admin</span>
      </div>
      <span class="fa-caption">Uploaded July 12 · 214 photos</span>
    </div>
  </div>
</div>
</body>
</html>
